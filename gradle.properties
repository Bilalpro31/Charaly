# ===========================================================================
# CHARALY - a local-first, deterministic story runtime for Android
#
# OFFLINE GUARANTEE
#   This project declares NO android.permission.INTERNET permission. The OS
#   refuses to let the app open a socket, so conversations, character data,
#   memories, world state and model data cannot leave the device.
#
# LOCAL INFERENCE
#   llama.cpp is compiled into the app's own native library and runs in-process.
#   There is no inference server, no FastAPI, no llama-server, no PC acting as
#   a host, and no cloud API. See app/src/main/cpp/CMakeLists.txt.
#
# TESTING
#   ./gradlew verify        -> the whole deterministic runtime on a plain JVM.
#                               No device, no emulator, no model download.
#   ./gradlew :app:assembleDebug
#
# LOCAL ARM64 HOST ONLY
#   The lines at the bottom are for verifying the Android build on an aarch64
#   machine, where the SDK's aapt2 is an x86_64 binary. Delete them elsewhere.
# ===========================================================================

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# --- LOCAL ARM64 HOST ONLY -------------------------------------------------
# This machine is aarch64 and the Android SDK's aapt2 is an x86_64 binary, so it
# cannot run natively. The wrapper executes the real x86_64 aapt2 under
# qemu-user, which lets this build be verified on ARM hardware.
#
# Delete this line on a normal x86_64 developer machine.
android.aapt2FromMavenOverride=/opt/aapt2-arm-host/aapt2
